[package]
name = "vector_sdk_js"
version = "0.1.0"
edition = "2021"
description = "Node.js bindings for the Vector messenger Rust SDK (vector_sdk)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["voice", "xdc"]
voice = ["vector_sdk/voice"]
xdc = ["vector_sdk/xdc"]
whisper = ["voice", "vector_sdk/whisper"]
tor = ["vector_sdk/tor"]
i2p = ["vector_sdk/i2p"]

[dependencies]
vector_sdk = { version = "0.12.0", default-features = false }
napi = { version = "3", default-features = false, features = ["napi9", "async", "tokio_rt", "serde-json"] }
napi-derive = "3"
tokio = { version = "1.49", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
serde = "1"
serde_json = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
